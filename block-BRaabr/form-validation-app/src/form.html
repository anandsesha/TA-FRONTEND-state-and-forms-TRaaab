<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1.0, initial-scale=1.0" />
    <link rel="stylesheet" href="./form.css" />
    <title>Multiple Input Elements - Form</title>
  </head>
  <body>
    <center>
      <form action="">
        <!-- Text -->
        <label for="">Text Input</label>
        <input type="text" name="text" id="" />
        <!-- Date -->
        <label for="">Date Input</label>
        <input type="date" name="date" id="" />
        <!-- File -->
        <label for="">File Input</label>
        <input type="file" name="file" id="" />
        <!-- Read Only -->
        <label for="">Read-Only Input</label>
        <input
          type="text"
          name="file"
          id=""
          readonly
          placeholder="This text is read only"
        />
        <!-- Disabled Input -->
        <label for="">Disabled Input</label>
        <input type="text" name="file" id="" disabled />
        <!-- Textarea -->
        <label for="">Textarea</label>
        <textarea name="textarea" id="" rows="8" cols="8"></textarea>
        <!-- Textarea Disabled-->
        <label for="">Textarea</label>
        <textarea name="textarea" id="" rows="8" cols="8" disabled></textarea>
      </form>
    </center>
  </body>
</html>
